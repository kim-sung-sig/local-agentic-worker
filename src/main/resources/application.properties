spring.application.name=agentic-worker

server.port=18081

spring.datasource.url=jdbc:postgresql://localhost:15432/agentic_worker
spring.datasource.username=dev_user
spring.datasource.password=dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

spring.flyway.locations=classpath\:db/migration

spring.kafka.bootstrap-servers=localhost\:29092
spring.kafka.consumer.group-id=agent-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.worker.*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.concurrency=1

agent.claude.cli-path=claude
agent.claude.timeout-minutes=10

