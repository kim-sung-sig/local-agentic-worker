# Local integration stack for the Worker Gateway slice.
#
#   docker compose -f docker-compose.dev.yml up -d                      # ledger Postgres only
#   docker compose -f docker-compose.dev.yml --profile temporal up -d   # + Temporal server + UI
#
# No real/sensitive credentials are committed here. The values below are
# throwaway dev defaults for local containers only; override with a .env file
# or shell environment if desired. Do NOT reuse these anywhere non-local.
services:
  # Durable execution/event ledger for the Python Worker (agent_worker schema).
  postgres:
    image: postgres:16
    container_name: agent-worker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_worker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_worker"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- Temporal server (profile: temporal) -----------------------------------
  # Metadata store for Temporal itself (separate from the app ledger above).
  temporal-postgresql:
    image: postgres:16
    container_name: agent-worker-temporal-postgres
    profiles:
      - temporal
    environment:
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PWD:-temporal}
    ports:
      - "15434:5432"
    volumes:
      - temporal-postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_DB_USER:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  temporal:
    image: temporalio/auto-setup:1.29.1
    container_name: agent-worker-temporal
    profiles:
      - temporal
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_DB_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_DB_PWD:-temporal}
      POSTGRES_SEEDS: temporal-postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    ports:
      - "7233:7233"
    volumes:
      - ./dev/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD-SHELL", "temporal operator namespace describe --namespace default >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.49.1
    container_name: agent-worker-temporal-ui
    profiles:
      - temporal
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - "8233:8080"

volumes:
  temporal-postgresql-data:
