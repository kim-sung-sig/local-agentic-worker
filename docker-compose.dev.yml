services:
  postgres:
    image: postgres:16
    container_name: agent-worker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agent_worker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_worker"]
      interval: 3s
      timeout: 3s
      retries: 20
