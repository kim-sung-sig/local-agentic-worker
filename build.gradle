plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.springframework.boot:spring-boot-starter-web'

	implementation 'org.springframework.kafka:spring-kafka'
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'


	runtimeOnly 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
}

def frontendDir = "$projectDir/frontend"
def npmCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	workingDir frontendDir
	inputs.file "$frontendDir/package.json"
	outputs.dir "$frontendDir/node_modules"
	commandLine npmCommand, 'install'
}

tasks.register('npmBuild', Exec) {
	dependsOn npmInstall
	workingDir frontendDir
	inputs.dir "$frontendDir/src"
	inputs.file "$frontendDir/vite.config.js"
	outputs.dir "$projectDir/src/main/resources/static"
	commandLine npmCommand, 'run', 'build'
}

processResources.dependsOn(npmBuild)

tasks.named('test') {
	useJUnitPlatform()
}
